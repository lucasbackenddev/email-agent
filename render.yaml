# Blueprint do Render — cria o serviço web + PostgreSQL automaticamente
# Ao conectar o repositório no Render, escolha "Blueprint" e ele lê este arquivo.
services:
  - type: web
    name: inbox-assistant-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inbox-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: GMAIL_USER
        sync: false   # preencher no dashboard (segredo)
      - key: GMAIL_APP_PASSWORD
        sync: false   # preencher no dashboard (segredo)
      - key: GEMINI_API_KEY
        sync: false   # preencher no dashboard (segredo)
      - key: GEMINI_MODEL
        value: gemini-3.8-flash

databases:
  - name: inbox-db
    plan: free
    databaseName: inbox
    user: inbox
