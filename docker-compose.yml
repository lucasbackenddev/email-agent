services:
  web:
    build: .
    container_name: inbox_web
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://inbox:inbox_secret@db:5432/inbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: .
    container_name: inbox_worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://inbox:inbox_secret@db:5432/inbox
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.celery_app worker --loglevel=info --pool=solo

  db:
    image: postgres:16-alpine
    container_name: inbox_db
    environment:
      POSTGRES_USER: inbox
      POSTGRES_PASSWORD: inbox_secret
      POSTGRES_DB: inbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inbox -d inbox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: inbox_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  redisdata:
    driver: local
